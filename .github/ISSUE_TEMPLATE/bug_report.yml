name: Bug report
description: Report a reproducible Coordiation defect.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md instead.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CSS compiler or utilities
        - Vite or PostCSS integration
        - CLI or agent lifecycle
        - Components
        - Icons
        - Themes
        - Documentation website
        - Registry or API
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Include the exact package version or website revision if known.
      placeholder: 1.0.0-rc.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node version, package manager, browser, and framework when relevant.
      placeholder: Ubuntu 24.04, Node 24, pnpm 10, Vite 8
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide exact steps, code, or a small repository.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste relevant diagnostics, screenshots, or build output with secrets removed.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private data.
          required: true

